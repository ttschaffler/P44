# Copy to the repo root as fly.toml, then: fly launch --copy-config --no-deploy
app = "waypoint-CHANGE-ME"
primary_region = "fra"

[build]

[env]
  WAYPOINT_DB = "/data/waypoint.db"
  WAYPOINT_PUBLIC_URL = "https://waypoint-CHANGE-ME.fly.dev"

[mounts]
  source = "waypoint_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
